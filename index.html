
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-card">
    <h1>🌦️ Weather App</h1>
    <p>Check live weather in your city</p>

    <form id="weatherForm">
      <input id="cityInput" placeholder="Enter city name" required>
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status">Enter a city to get started.</p>

    <section id="weatherInfo" hidden>
      <h2 id="cityName"></h2>
      <div id="weatherIcon">🌤️</div>
      <h3 id="temperature"></h3>
      <p id="condition"></p>

      <div class="details">
        <p>💧 Humidity: <span id="humidity"></span></p>
        <p>💨 Wind: <span id="wind"></span></p>
      </div>
    </section>

    <footer>Weather data: Open-Meteo</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
